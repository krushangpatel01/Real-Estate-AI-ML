<!-- EstateAI project file - implementation will be added step by step. -->
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password | EstateAI</title>


    <!-- Fonts -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- Forgot Password CSS -->

    <link
        rel="stylesheet"
        href="../assets/css/forgot-password.css"
    >

</head>


<body>

<main class="forgot-page">


    <div class="forgot-card">


        <!-- ================================================
             TOP BRAND
        ================================================= -->

        <a
            href="index.html"
            class="forgot-brand"
        >

            <div class="forgot-brand-logo">
                E
            </div>

            <div class="forgot-brand-name">
                Estate<span>AI</span>
            </div>

        </a>



        <!-- ================================================
             ICON
        ================================================= -->

        <div class="forgot-icon">

            <span>↻</span>

        </div>



        <!-- ================================================
             CONTENT
        ================================================= -->

        <div class="forgot-content">

            <div class="forgot-eyebrow">

                ACCOUNT RECOVERY

            </div>


            <h1>
                Forgot Your
                <span>Password?</span>
            </h1>


            <p>

                Don't worry. Enter the email address
                associated with your EstateAI account
                and we'll help you reset your password.

            </p>

        </div>



        <!-- ================================================
             MESSAGE
        ================================================= -->

        <div
            id="forgotMessage"
            class="forgot-message"
        ></div>



        <!-- ================================================
             FORM
        ================================================= -->

        <form
            id="forgotForm"
            class="forgot-form"
            novalidate
        >


            <div class="forgot-field">

                <label for="forgotEmail">
                    Email Address
                </label>


                <div class="forgot-input-wrapper">

                    <span class="forgot-input-icon">
                        @
                    </span>


                    <input
                        type="email"
                        id="forgotEmail"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >

                </div>

            </div>



            <button
                type="submit"
                id="forgotBtn"
                class="forgot-submit"
            >

                <span>
                    Send Reset Link
                </span>

                <span>
                    →
                </span>

            </button>


        </form>



        <!-- ================================================
             BACK TO LOGIN
        ================================================= -->

        <a
            href="login.html"
            class="forgot-back"
        >

            <span>←</span>

            Back to Sign In

        </a>



        <!-- ================================================
             SECURITY
        ================================================= -->

        <div class="forgot-security">

            <span class="forgot-security-icon">
                ✓
            </span>

            <span>
                Your account information is securely protected.
            </span>

        </div>


    </div>


</main>


<script src="../assets/js/auth.js"></script>

</body>

</html>
