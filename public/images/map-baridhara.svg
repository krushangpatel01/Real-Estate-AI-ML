<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" preserveAspectRatio="xMidYMid slice">
  <rect width="900" height="620" fill="#eaede8"/>
  <!-- Minimalist Monochrome Architectural District Map (Baridhara / Gulshan Lake) -->
  <path d="M520,0 Q555,140 505,280 Q465,400 545,620 L615,620 Q535,410 570,285 Q615,140 580,0 Z" fill="#cfd8d4"/>
  <!-- Parks -->
  <rect x="110" y="90" width="140" height="110" rx="6" fill="#dce2d9"/>
  <rect x="640" y="340" width="165" height="135" rx="6" fill="#dce2d9"/>
  <!-- Clean Street Grid -->
  <g stroke="#d4d8d2" stroke-width="2" fill="none">
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="185" x2="900" y2="185"/>
    <line x1="0" y1="305" x2="900" y2="305"/>
    <line x1="0" y1="425" x2="900" y2="425"/>
    <line x1="0" y1="535" x2="900" y2="535"/>
    <line x1="150" y1="0" x2="150" y2="620"/>
    <line x1="310" y1="0" x2="310" y2="620"/>
    <line x1="450" y1="0" x2="450" y2="620"/>
    <line x1="690" y1="0" x2="690" y2="620"/>
  </g>
  <!-- Primary Avenues -->
  <g stroke="#ffffff" stroke-width="7" fill="none">
    <path d="M0,245 Q320,245 450,280 T900,260"/>
    <path d="M380,0 L380,620"/>
  </g>
  <!-- District Labels -->
  <g fill="#7c8580" font-family="sans-serif" font-size="11" letter-spacing="3">
    <text x="165" y="150">GULSHAN NORTH</text>
    <text x="645" y="160">BARIDHARA DIPLOMATIC</text>
    <text x="170" y="480">BANANI LAKEFRONT</text>
  </g>
  <!-- Velux Gallery Pin -->
  <circle cx="450" cy="280" r="38" fill="#102822" opacity="0.14"/>
  <circle cx="450" cy="280" r="18" fill="#102822"/>
  <circle cx="450" cy="280" r="6" fill="#d4af7a"/>
</svg>
