<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky3" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#141920"/>
      <stop offset="60%" stop-color="#222a33"/>
      <stop offset="100%" stop-color="#0b0d0f"/>
    </linearGradient>
    <linearGradient id="warm3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffdfa8"/>
      <stop offset="100%" stop-color="#9e6730"/>
    </linearGradient>
    <filter id="blur3"><feGaussianBlur stdDeviation="20"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#sky3)"/>
  <ellipse cx="900" cy="480" rx="540" ry="180" fill="#e0a65d" opacity="0.2" filter="url(#blur3)"/>

  <!-- Pine Forest Backdrop -->
  <g fill="#0c1114">
    <polygon points="120,620 190,260 260,620"/>
    <polygon points="240,620 320,210 400,620"/>
    <polygon points="1220,620 1310,190 1400,620"/>
    <polygon points="1350,620 1445,250 1540,620"/>
  </g>

  <!-- Stone & Glass Courtyard Pavilion -->
  <rect x="380" y="340" width="900" height="320" fill="#181b1f"/>
  <rect x="360" y="325" width="940" height="20" fill="#292e36"/>
  <!-- Left Basalt Stone Tower -->
  <rect x="380" y="230" width="220" height="430" fill="#1f2328" stroke="#2c3138"/>
  <rect x="425" y="280" width="130" height="90" fill="url(#warm3)" opacity="0.75"/>
  <!-- Main Glass & Oak Salon -->
  <rect x="620" y="370" width="630" height="270" fill="url(#warm3)" opacity="0.86"/>
  <rect x="620" y="370" width="630" height="28" fill="#5e3c22"/>
  <g fill="#181b1f">
    <rect x="770" y="370" width="12" height="270"/>
    <rect x="935" y="370" width="12" height="270"/>
    <rect x="1100" y="370" width="12" height="270"/>
  </g>

  <!-- Courtyard Water & Lawn -->
  <rect x="0" y="660" width="1600" height="240" fill="#0b0f0c"/>
  <rect x="520" y="685" width="790" height="125" fill="#111a22" opacity="0.9"/>
  <rect x="620" y="695" width="620" height="90" fill="#d4984e" opacity="0.16" filter="url(#blur3)"/>

  <linearGradient id="vig3" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#090b0d" stop-opacity="0.86"/>
    <stop offset="55%" stop-color="#090b0d" stop-opacity="0.28"/>
    <stop offset="100%" stop-color="#090b0d" stop-opacity="0.62"/>
  </linearGradient>
  <rect width="1600" height="900" fill="url(#vig3)"/>
</svg>
