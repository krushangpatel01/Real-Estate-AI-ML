<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky4" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#17202b"/>
      <stop offset="50%" stop-color="#283444"/>
      <stop offset="100%" stop-color="#0b0d0f"/>
    </linearGradient>
    <linearGradient id="warm4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe7bd"/>
      <stop offset="60%" stop-color="#d8974b"/>
      <stop offset="100%" stop-color="#6b4018"/>
    </linearGradient>
    <filter id="blur4"><feGaussianBlur stdDeviation="24"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#sky4)"/>
  <ellipse cx="980" cy="510" rx="560" ry="200" fill="#e5ab60" opacity="0.24" filter="url(#blur4)"/>

  <!-- Atmospheric garden silhouettes -->
  <path d="M0,560 Q280,430 560,510 Q960,400 1320,480 Q1480,430 1600,480 L1600,760 L0,760 Z" fill="#0f1519"/>
  <rect x="0" y="700" width="1600" height="200" fill="#121a12"/>

