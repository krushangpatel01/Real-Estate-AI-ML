<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 650" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgDet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1014"/>
      <stop offset="100%" stop-color="#172128"/>
    </linearGradient>
    <linearGradient id="slat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c68346"/>
      <stop offset="100%" stop-color="#5d3616"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="650" fill="url(#bgDet)"/>
  <!-- Architectural Dark Steel Mullions & Warm Timber Louvers -->
  <g fill="#1c232a">
    <rect x="0" y="0" width="1600" height="180"/>
    <rect x="110" y="180" width="28" height="470"/>
    <rect x="360" y="180" width="28" height="470"/>
    <rect x="610" y="180" width="28" height="470"/>
  </g>
  <!-- Warm backlit timber slats on lower right -->
  <rect x="640" y="420" width="960" height="230" fill="#2a190d"/>
  <g fill="url(#slat)">
    <rect x="680" y="420" width="16" height="230"/><rect x="720" y="420" width="16" height="230"/>
    <rect x="760" y="420" width="16" height="230"/><rect x="800" y="420" width="16" height="230"/>
    <rect x="840" y="420" width="16" height="230"/><rect x="880" y="420" width="16" height="230"/>
    <rect x="920" y="420" width="16" height="230"/><rect x="960" y="420" width="16" height="230"/>
    <rect x="1000" y="420" width="16" height="230"/><rect x="1040" y="420" width="16" height="230"/>
    <rect x="1080" y="420" width="16" height="230"/><rect x="1120" y="420" width="16" height="230"/>
    <rect x="1160" y="420" width="16" height="230"/><rect x="1200" y="420" width="16" height="230"/>
  </g>
  <!-- Soft warm architectural glow -->
  <rect x="0" y="0" width="1600" height="650" fill="#090c0f" opacity="0.45"/>
</svg>
